<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Comparison Tool</title>
    <link rel="stylesheet" href="css/styles.css">

    <meta name="description" content="Free online tool to compare and find differences between two text files.">
    <meta name="keywords" content="Text comparison, compare text files, text diff, text diff tool, text diff online">
    <meta name="author" content="Text Comparison Tool">
    <meta name="robots" content="index, follow">    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sachininmindfire.github.io/text-diff/">
    <meta property="og:title" content="Text Comparison Tool">
    <meta property="og:description" content="Free online tool to compare and find differences between two text files.">
    <meta property="og:image" content="https://sachininmindfire.github.io/images/og-image.png">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://sachininmindfire.github.io/text-diff/">
    <meta name="twitter:title" content="Text Comparison Tool">
    <meta name="twitter:description" content="Free online tool to compare and find differences between two text files.">
    <meta name="twitter:image" content="https://sachininmindfire.github.io/images/twitter-image.png">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f7f9fc;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .input-section {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .text-input {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .text-input label {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        /* Editor container styling */
        .editor-container {
            height: 300px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 10px;
            background-color: white;
        }
        
        /* Styling for the plain text fallback */
        .plain-text-fallback {
            display: none;
            height: 300px;
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
            font-family: monospace;
            white-space: pre-wrap;
            overflow-x: auto;
        }
        
        .editor-toggle {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }
        
        .editor-toggle label {
            margin-left: 5px;
            font-size: 14px;
        }
        
        .file-input {
            margin-top: 10px;
        }
        
        .btn-container {
            text-align: center;
            margin: 20px 0;
        }
        
        .action-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s;
            margin: 0 5px;
        }
        
        .action-btn:hover {
            background-color: #45a049;
        }
        
        .settings {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
            gap: 20px;
        }
        
        .settings label {
            margin-right: 5px;
            font-size: 14px;
        }
        
        .result-section {
            display: flex;
            gap: 20px;
        }
        
        .diff-container {
            flex: 1;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            max-height: 500px;
            overflow-y: auto;
        }
        
        .diff-title {
            font-weight: bold;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid #eee;
        }
        
        .diff-content {
            font-family: monospace;
            line-height: 1.5;
        }
        
        .deleted {
            text-decoration: line-through;
            color: #d32f2f;
            background-color: #ffebee;
        }
        
        .added {
            background-color: #e8f5e9;
            color: #2e7d32;
        }
        
        .diff-line {
            margin: 4px 0;
            white-space: nowrap;
            overflow-x: auto;
            padding-bottom: 5px; /* Space for the scrollbar */
        }
        
        .instructions {
            background-color: #e8f5e9;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        /* Mode switch container */
        .mode-switch {
            text-align: center;
            margin-bottom: 15px;
        }

        .mode-switch button {
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            padding: 8px 15px;
            cursor: pointer;
            font-size: 14px;
        }

        .mode-switch button.active {
            background-color: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }

        .mode-switch button:first-child {
            border-radius: 4px 0 0 4px;
        }

        .mode-switch button:last-child {
            border-radius: 0 4px 4px 0;
        }

        /* Styling for the rich text comparison result */
        .rich-diff-container {
            display: none;
        }
    </style>
</head>
<body>
    <script src="https://sachininmindfire.github.io/shared-components/header.js"></script>
    <div class="container">
        <h1>Text Comparison Tool</h1>
        
        <div class="instructions">
            <p>Upload or create formatted text to compare. The tool will highlight deleted content with <span class="deleted">strikethrough</span> and added content with <span class="added">green highlighting</span>.</p>
        </div>

        <div class="mode-switch">
            <button id="richModeBtn" class="active">Rich Text Mode</button>
            <button id="plainModeBtn">Plain Text Mode</button>
        </div>
        
        <div class="input-section">
            <div class="text-input">
                <label for="editor1">Original Text:</label>
                <div id="editor1" class="editor-container"></div>
                <textarea id="plainText1" class="plain-text-fallback" placeholder="Paste original text here..."></textarea>
                <div class="file-input">
                    <input type="file" id="file1" accept=".txt,.html">
                </div>
            </div>
            
            <div class="text-input">
                <label for="editor2">Modified Text:</label>
                <div id="editor2" class="editor-container"></div>
                <textarea id="plainText2" class="plain-text-fallback" placeholder="Paste modified text here..."></textarea>
                <div class="file-input">
                    <input type="file" id="file2" accept=".txt,.html">
                </div>
            </div>
        </div>
        
        <div class="settings">
            <div>
                <input type="checkbox" id="ignoreBlankLines" checked>
                <label for="ignoreBlankLines">Ignore blank lines</label>
            </div>
            <div>
                <input type="checkbox" id="ignoreFormatting">
                <label for="ignoreFormatting">Compare text only (ignore formatting)</label>
            </div>
        </div>
        
        <div class="btn-container">
            <button id="compareBtn" class="action-btn">Compare Texts</button>
            <button id="clearBtn" class="action-btn" style="background-color: #f44336;">Clear All</button>
        </div>
        
        <div class="result-section">
            <div class="diff-container" id="plainTextDiff">
                <div class="diff-title">Plain Text Comparison Results</div>
                <div id="diffOutput" class="diff-content"></div>
            </div>
            <div class="diff-container rich-diff-container" id="richTextDiff">
                <div class="diff-title">Rich Text Comparison Results</div>
                <div id="richDiffOutput" class="diff-content"></div>
            </div>
        </div>
    </div>
    <script>
        let quill1, quill2;
        let currentMode = 'rich';
        
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize Quill editors
            const toolbarOptions = [
                [{ 'font': [] }],
                [{ 'header': [1, 2, 3, 4, 5, 6, false] }],
                ['bold', 'italic', 'underline', 'strike'],
                [{ 'color': [] }, { 'background': [] }],
                [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                [{ 'script': 'sub'}, { 'script': 'super' }],
                [{ 'indent': '-1'}, { 'indent': '+1' }],
                [{ 'align': [] }],
                ['link', 'image'],
                ['clean']
            ];
            
            quill1 = new Quill('#editor1', {
                theme: 'snow',
                modules: {
                    toolbar: toolbarOptions
                },
                placeholder: 'Enter original text here...'
            });
            
            quill2 = new Quill('#editor2', {
                theme: 'snow',
                modules: {
                    toolbar: toolbarOptions
                },
                placeholder: 'Enter modified text here...'
            });
            
            // Mode switch
            document.getElementById('richModeBtn').addEventListener('click', function() {
                switchMode('rich');
            });
            
            document.getElementById('plainModeBtn').addEventListener('click', function() {
                switchMode('plain');
            });
            
            // File input handlers
            document.getElementById('file1').addEventListener('change', function(e) {
                readFileContent(e.target.files[0], 'editor1');
            });
            
            document.getElementById('file2').addEventListener('change', function(e) {
                readFileContent(e.target.files[0], 'editor2');
            });
            
            // Compare button handler
            document.getElementById('compareBtn').addEventListener('click', compareTexts);
            
            // Clear button handler
            document.getElementById('clearBtn').addEventListener('click', clearAll);
        });
        
        function switchMode(mode) {
            currentMode = mode;
            
            if (mode === 'rich') {
                // Switch to rich text mode
                document.getElementById('richModeBtn').classList.add('active');
                document.getElementById('plainModeBtn').classList.remove('active');
                
                document.querySelectorAll('.editor-container').forEach(el => {
                    el.style.display = 'block';
                });
                
                document.querySelectorAll('.plain-text-fallback').forEach(el => {
                    el.style.display = 'none';
                });
                
                // Transfer plain text to rich text if needed
                const plainText1 = document.getElementById('plainText1').value;
                const plainText2 = document.getElementById('plainText2').value;
                
                if (plainText1 && quill1.getText().trim() === '') {
                    quill1.setText(plainText1);
                }
                
                if (plainText2 && quill2.getText().trim() === '') {
                    quill2.setText(plainText2);
                }
            } else {
                // Switch to plain text mode
                document.getElementById('richModeBtn').classList.remove('active');
                document.getElementById('plainModeBtn').classList.add('active');
                
                document.querySelectorAll('.editor-container').forEach(el => {
                    el.style.display = 'none';
                });
                
                document.querySelectorAll('.plain-text-fallback').forEach(el => {
                    el.style.display = 'block';
                });
                
                // Transfer rich text to plain text
                const richText1 = quill1.getText();
                const richText2 = quill2.getText();
                
                document.getElementById('plainText1').value = richText1;
                document.getElementById('plainText2').value = richText2;
            }
        }
        
        function readFileContent(file, targetEditorId) {
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                
                if (currentMode === 'rich') {
                    // Try to detect if it's HTML
                    if (content.trim().startsWith('<') && content.includes('</')) {
                        // It's likely HTML, load it as Delta
                        if (targetEditorId === 'editor1') {
                            quill1.clipboard.dangerouslyPasteHTML(content);
                        } else {
                            quill2.clipboard.dangerouslyPasteHTML(content);
                        }
                    } else {
                        // Plain text
                        if (targetEditorId === 'editor1') {
                            quill1.setText(content);
                        } else {
                            quill2.setText(content);
                        }
                    }
                } else {
                    // Plain text mode
                    if (targetEditorId === 'editor1') {
                        document.getElementById('plainText1').value = content;
                    } else {
                        document.getElementById('plainText2').value = content;
                    }
                }
            };
            reader.readAsText(file);
        }
        
        function compareTexts() {
            let text1, text2;
            
            if (currentMode === 'rich') {
                const ignoreFormatting = document.getElementById('ignoreFormatting').checked;
                
                if (ignoreFormatting) {
                    // Compare only text content
                    text1 = quill1.getText();
                    text2 = quill2.getText();
                } else {
                    // Compare with formatting (use HTML)
                    text1 = quill1.root.innerHTML;
                    text2 = quill2.root.innerHTML;
                    
                    // For rich text comparison (future enhancement)
                    compareRichText(text1, text2);
                }
            } else {
                // Plain text mode
                text1 = document.getElementById('plainText1').value;
                text2 = document.getElementById('plainText2').value;
            }
            
            if (!text1 || !text2) {
                alert('Please provide both texts to compare.');
                return;
            }
            
            const ignoreBlankLines = document.getElementById('ignoreBlankLines').checked;
            const diffResult = generateDiff(text1, text2, ignoreBlankLines);
            document.getElementById('diffOutput').innerHTML = diffResult;
            
            // Show the appropriate diff container
            document.getElementById('plainTextDiff').style.display = 'block';
            
            const ignoreFormatting = document.getElementById('ignoreFormatting').checked;
            if (currentMode === 'rich' && !ignoreFormatting) {
                document.getElementById('richTextDiff').style.display = 'block';
            } else {
                document.getElementById('richTextDiff').style.display = 'none';
            }
        }
        
        function compareRichText(html1, html2) {
            // Basic implementation for rich text comparison
            // This is a placeholder for a more sophisticated rich text comparison
            // In a real implementation, you'd use a specialized library
            
            const diffOutput = document.getElementById('richDiffOutput');
            
            // For now, just show a simple comparison
            diffOutput.innerHTML = '<div>Rich text comparison is a complex feature that requires specialized algorithms.</div>' +
                                   '<div>This is a simplified representation:</div>' +
                                   '<div class="deleted">Original content length: ' + html1.length + ' characters</div>' +
                                   '<div class="added">Modified content length: ' + html2.length + ' characters</div>';
            
            // TODO: Implement a more sophisticated rich text comparison
            // Options include:
            // 1. Using a specialized diff library that handles HTML
            // 2. Converting the rich text to a structured format (like JSON) and diffing that
            // 3. Using the Quill Delta format to compare changes
        }
        
        function generateDiff(text1, text2, ignoreBlankLines) {
            // Split both texts into lines
            let lines1 = text1.split('\n');
            let lines2 = text2.split('\n');
            
            // If ignoring blank lines, filter them out
            if (ignoreBlankLines) {
                lines1 = lines1.filter(line => line.trim() !== '');
                lines2 = lines2.filter(line => line.trim() !== '');
            }
            
            // Compare the lines
            return compareLines(lines1, lines2);
        }
        
        function compareLines(lines1, lines2) {
            let diffHtml = '';
            const maxLines = Math.max(lines1.length, lines2.length);
            
            // Simple line-by-line comparison
            for (let i = 0; i < maxLines; i++) {
                const line1 = i < lines1.length ? lines1[i] : '';
                const line2 = i < lines2.length ? lines2[i] : '';
                
                if (line1 === line2) {
                    // Lines are identical
                    diffHtml += `<div class="diff-line">${escapeHtml(line1)}</div>`;
                } else {
                    // Lines are different, find word-level differences
                    diffHtml += `<div class="diff-line">${compareLinesByWords(line1, line2)}</div>`;
                }
            }
            
            return diffHtml;
        }
        
        function compareLinesByWords(line1, line2) {
            if (!line1) return formatAddedWords(line2);
            if (!line2) return formatDeletedWords(line1);
            
            // Split lines into words
            const words1 = line1.split(/(\s+)/).filter(word => word !== '');
            const words2 = line2.split(/(\s+)/).filter(word => word !== '');
            
            // Use the Myers diff algorithm for word-level comparison
            const diffs = diffWords(words1, words2);
            
            return diffs.map(part => {
                if (part.added) {
                    return `<span class="added">${escapeHtml(part.value)}</span>`;
                } else if (part.removed) {
                    return `<span class="deleted">${escapeHtml(part.value)}</span>`;
                } else {
                    return escapeHtml(part.value);
                }
            }).join('');
        }
        
        function formatDeletedWords(text) {
            return `<span class="deleted">${escapeHtml(text)}</span>`;
        }
        
        function formatAddedWords(text) {
            return `<span class="added">${escapeHtml(text)}</span>`;
        }
        
        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
        
        // A simple implementation of the Myers diff algorithm for word-level comparison
        function diffWords(oldWords, newWords) {
            const result = [];
            const oldLength = oldWords.length;
            const newLength = newWords.length;
            
            let i = 0;
            let j = 0;
            
            while (i < oldLength || j < newLength) {
                // Match identical sequences of words
                if (i < oldLength && j < newLength && oldWords[i] === newWords[j]) {
                    result.push({ value: oldWords[i] });
                    i++;
                    j++;
                    continue;
                }
                
                // Look ahead to find matches
                let matchFound = false;
                
                // Check if any upcoming word in old text matches current new word
                for (let k = i + 1; k < oldLength && !matchFound; k++) {
                    if (oldWords[k] === newWords[j]) {
                        // Words in between are deletions
                        for (let l = i; l < k; l++) {
                            result.push({ value: oldWords[l], removed: true });
                        }
                        i = k;
                        matchFound = true;
                    }
                }
                
                // Check if any upcoming word in new text matches current old word
                for (let k = j + 1; k < newLength && !matchFound; k++) {
                    if (newWords[k] === oldWords[i]) {
                        // Words in between are additions
                        for (let l = j; l < k; l++) {
                            result.push({ value: newWords[l], added: true });
                        }
                        j = k;
                        matchFound = true;
                    }
                }
                
                // If no match found, consider current words as one deletion and one addition
                if (!matchFound) {
                    if (i < oldLength) {
                        result.push({ value: oldWords[i], removed: true });
                        i++;
                    }
                    if (j < newLength) {
                        result.push({ value: newWords[j], added: true });
                        j++;
                    }
                }
            }
            
            return result;
        }
        
        function clearAll() {
            // Clear rich text editors
            quill1.setText('');
            quill2.setText('');
            
            // Clear plain text areas
            document.getElementById('plainText1').value = '';
            document.getElementById('plainText2').value = '';
            
            // Clear diff output
            document.getElementById('diffOutput').innerHTML = '';
            document.getElementById('richDiffOutput').innerHTML = '';
        }
    </script>
    <script src="https://sachininmindfire.github.io/shared-components/footer.js"></script>
</body>
</html>

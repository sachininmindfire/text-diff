<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Comparison Tool</title>
    <link rel="stylesheet" href="css/styles.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Free online tool to compare and find differences between two text files.">
    <meta name="keywords" content="Text comparison, compare text files, text diff, text diff tool, text diff online">
    <meta name="author" content="Text Comparison Tool">
    <meta name="robots" content="index, follow">    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sachininmindfire.github.io/text-diff/">
    <meta property="og:title" content="Text Comparison Tool">
    <meta property="og:description" content="Free online tool to compare and find differences between two text files.">
    <meta property="og:image" content="https://sachininmindfire.github.io/images/og-image.png">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://sachininmindfire.github.io/text-diff/">
    <meta name="twitter:title" content="Text Comparison Tool">
    <meta name="twitter:description" content="Free online tool to compare and find differences between two text files.">
    <meta name="twitter:image" content="https://sachininmindfire.github.io/images/twitter-image.png">

</head>
<body>
    <script src="https://sachininmindfire.github.io/shared-components/header.js"></script>
    <div class="container">
        <!-- Top Controls -->
        <div class="controls">
            <button id="compareBtn" class="action-btn">Compare</button>
            <button id="toggleBtn" class="action-btn">Toggle</button>
            <button id="clearBtn" class="action-btn">Clear</button>
        </div>
        <div class="comparison-wrapper">
            <!-- Left Panel -->
            <div class="panel left-panel">
                <div class="file-input">
                    <button class="file-btn" onclick="chooseFile('left')">Open</button>                    
                    <input type="text" id="leftFileName" placeholder="Enter filename" class="filename-input">
                    <button class="save-btn" onclick="saveText('left')">Save As</button>
                </div>
                <textarea id="leftText" placeholder="Enter text for comparison..." class="text-area"></textarea>
                <pre id="leftDiff" class="diff-display" style="display: none;"></pre>
            </div>

            <!-- Right Panel -->
            <div class="panel right-panel">
                <div class="file-input">
                    <button class="file-btn" onclick="chooseFile('right')">Open</button>
                    <input type="text" id="rightFileName" placeholder="Enter filename" class="filename-input">                    
                    <button class="save-btn" onclick="saveText('right')">Save As</button>
                </div>
                <textarea id="rightText" placeholder="Enter text for comparison..." class="text-area"></textarea>
                <pre id="rightDiff" class="diff-display" style="display: none;"></pre>
            </div>
        </div>
    </div>
    <script src="js/diffHandler.js"></script>
    <script src="js/fileHandler.js"></script>
    <script src="js/main.js"></script>
    <script src="https://sachininmindfire.github.io/shared-components/footer.js"></script>
</body>
</html>

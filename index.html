    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f7f9fc;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .input-section {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .text-input {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .text-input label {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        textarea {
            height: 200px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
            font-family: monospace;
            white-space: nowrap;
            overflow-x: auto;
        }
        
        .file-input {
            margin-top: 10px;
        }
        
        .btn-container {
            text-align: center;
            margin: 20px 0;
        }
        
        #compareBtn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        
        #compareBtn:hover {
            background-color: #45a049;
        }
        
        .settings {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
        }
        
        .settings label {
            margin-right: 10px;
            font-size: 14px;
        }
        
        .result-section {
            display: flex;
            gap: 20px;
        }
        
        .diff-container {
            flex: 1;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .diff-title {
            font-weight: bold;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid #eee;
        }
        
        .diff-content {
            font-family: monospace;
            line-height: 1.5;
        }
        
        .deleted {
            text-decoration: line-through;
            color: #d32f2f;
            background-color: #ffebee;
        }
        
        .added {
            background-color: #e8f5e9;
            color: #2e7d32;
        }
        
        .diff-line {
            margin: 4px 0;
            white-space: nowrap;
            overflow-x: auto;
            padding-bottom: 5px; /* Space for the scrollbar */
        }
        
        .instructions {
            background-color: #e8f5e9;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <script src="https://sachininmindfire.github.io/shared-components/header.js"></script>
    <div class="container">
        <h1>Text Comparison Tool</h1>
        
        <div class="instructions">
            <p>Upload or paste two text files to compare. The tool will highlight deleted words with <span class="deleted">strikethrough</span> and added words with <span class="added">green highlighting</span>.</p>
        </div>
        
        <div class="input-section">
            <div class="text-input">
                <label for="text1">Original Text:</label>
                <textarea id="text1" placeholder="Paste original text here..."></textarea>
                <div class="file-input">
                    <input type="file" id="file1" accept=".txt">
                </div>
            </div>
            
            <div class="text-input">
                <label for="text2">Modified Text:</label>
                <textarea id="text2" placeholder="Paste modified text here..."></textarea>
                <div class="file-input">
                    <input type="file" id="file2" accept=".txt">
                </div>
            </div>
        </div>
        
        <div class="settings">
            <input type="checkbox" id="ignoreBlankLines" checked>
            <label for="ignoreBlankLines">Ignore blank lines</label>
        </div>
        
        <div class="btn-container">
            <button id="compareBtn">Compare Texts</button>
        </div>
        
        <div class="result-section">
            <div class="diff-container">
                <div class="diff-title">Comparison Results</div>
                <div id="diffOutput" class="diff-content"></div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // File input handlers
            document.getElementById('file1').addEventListener('change', function(e) {
                readFileContent(e.target.files[0], 'text1');
            });
            
            document.getElementById('file2').addEventListener('change', function(e) {
                readFileContent(e.target.files[0], 'text2');
            });
            
            // Compare button handler
            document.getElementById('compareBtn').addEventListener('click', compareTexts);
        });
        
        function readFileContent(file, targetTextareaId) {
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById(targetTextareaId).value = e.target.result;
            };
            reader.readAsText(file);
        }
        
        function compareTexts() {
            const text1 = document.getElementById('text1').value;
            const text2 = document.getElementById('text2').value;
            
            if (!text1 || !text2) {
                alert('Please provide both texts to compare.');
                return;
            }
            
            const ignoreBlankLines = document.getElementById('ignoreBlankLines').checked;
            const diffResult = generateDiff(text1, text2, ignoreBlankLines);
            document.getElementById('diffOutput').innerHTML = diffResult;
        }
        
        function generateDiff(text1, text2, ignoreBlankLines) {
            // Split both texts into lines
            let lines1 = text1.split('\n');
            let lines2 = text2.split('\n');
            
            // If ignoring blank lines, filter them out
            if (ignoreBlankLines) {
                // Filter blank lines
                const filteredLines1 = lines1.filter(line => line.trim() !== '');
                const filteredLines2 = lines2.filter(line => line.trim() !== '');
                
                // Compare the filtered lines
                return compareLines(filteredLines1, filteredLines2);
            } else {
                // Compare all lines
                return compareLines(lines1, lines2);
            }
        }
        
        function compareLines(lines1, lines2) {
            let diffHtml = '';
            const maxLines = Math.max(lines1.length, lines2.length);
            
            // Simple line-by-line comparison
            for (let i = 0; i < maxLines; i++) {
                const line1 = i < lines1.length ? lines1[i] : '';
                const line2 = i < lines2.length ? lines2[i] : '';
                
                if (line1 === line2) {
                    // Lines are identical
                    diffHtml += `<div class="diff-line">${escapeHtml(line1)}</div>`;
                } else {
                    // Lines are different, find word-level differences
                    diffHtml += `<div class="diff-line">${compareLinesByWords(line1, line2)}</div>`;
                }
            }
            
            return diffHtml;
        }
        
        function compareLinesByWords(line1, line2) {
            if (!line1) return formatAddedWords(line2);
            if (!line2) return formatDeletedWords(line1);
            
            // Split lines into words
            const words1 = line1.split(/(\s+)/).filter(word => word !== '');
            const words2 = line2.split(/(\s+)/).filter(word => word !== '');
            
            // Use the Myers diff algorithm for word-level comparison
            const diffs = diffWords(words1, words2);
            
            return diffs.map(part => {
                if (part.added) {
                    return `<span class="added">${escapeHtml(part.value)}</span>`;
                } else if (part.removed) {
                    return `<span class="deleted">${escapeHtml(part.value)}</span>`;
                } else {
                    return escapeHtml(part.value);
                }
            }).join('');
        }
        
        function formatDeletedWords(text) {
            return `<span class="deleted">${escapeHtml(text)}</span>`;
        }
        
        function formatAddedWords(text) {
            return `<span class="added">${escapeHtml(text)}</span>`;
        }
        
        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
        
        // A simple implementation of the Myers diff algorithm for word-level comparison
        function diffWords(oldWords, newWords) {
            const result = [];
            const oldLength = oldWords.length;
            const newLength = newWords.length;
            
            let i = 0;
            let j = 0;
            
            while (i < oldLength || j < newLength) {
                // Match identical sequences of words
                if (i < oldLength && j < newLength && oldWords[i] === newWords[j]) {
                    result.push({ value: oldWords[i] });
                    i++;
                    j++;
                    continue;
                }
                
                // Look ahead to find matches
                let matchFound = false;
                
                // Check if any upcoming word in old text matches current new word
                for (let k = i + 1; k < oldLength && !matchFound; k++) {
                    if (oldWords[k] === newWords[j]) {
                        // Words in between are deletions
                        for (let l = i; l < k; l++) {
                            result.push({ value: oldWords[l], removed: true });
                        }
                        i = k;
                        matchFound = true;
                    }
                }
                
                // Check if any upcoming word in new text matches current old word
                for (let k = j + 1; k < newLength && !matchFound; k++) {
                    if (newWords[k] === oldWords[i]) {
                        // Words in between are additions
                        for (let l = j; l < k; l++) {
                            result.push({ value: newWords[l], added: true });
                        }
                        j = k;
                        matchFound = true;
                    }
                }
                
                // If no match found, consider current words as one deletion and one addition
                if (!matchFound) {
                    if (i < oldLength) {
                        result.push({ value: oldWords[i], removed: true });
                        i++;
                    }
                    if (j < newLength) {
                        result.push({ value: newWords[j], added: true });
                        j++;
                    }
                }
            }
            
            return result;
        }
    </script>
    <script src="https://sachininmindfire.github.io/shared-components/footer.js"></script>
</body>
</html>
